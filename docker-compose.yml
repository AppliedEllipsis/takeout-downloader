version: '3.8'

services:
  takeout-downloader:
    build: .
    container_name: takeout-downloader
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      # Mount your downloads directory (change path as needed)
      - /path/to/downloads:/downloads
      # Mount .env for configuration (create from .env.example)
      - ./.env:/app/.env:ro
    environment:
      # Auth - REQUIRED for internet-facing servers
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-changeme}
      # Download settings
      - OUTPUT_DIR=/downloads
      - PARALLEL_DOWNLOADS=2
      - FILE_COUNT=100
      # CORS - set to your domain for remote access
      - CORS_ORIGINS=http://localhost:5001
      # aria2c - set to "true" to enable
      - ARIA2C_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: aria2c daemon (uncomment to use instead of auto-start)
