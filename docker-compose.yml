# Google Takeout Downloader.
#
# TWO SERVICES, ONE PROFILE:
#
#   takeout-cli  (default)  terminal-native aria2c CLI — recommended for SSH
#                          /tmux/Docker chains. Paste a JSON payload when
#                          prompted; aria2c handles the rest.
#
#                          docker compose build
#                          docker compose run --rm takeout-cli
#
#   takeout     (profile: tui)  Textual TUI with progress bars, queue
#                               preview, directory browser. Fragile over
#                               SSH+tmux+brackets-paste; kept for users who
#                               prefer a UI on a local terminal.
#
#                          docker compose build
#                          docker compose --profile tui run --rm takeout
#
# Both services are INTERACTIVE: do NOT start with `up -d`. Use `run` so
# Docker attaches your terminal to them.
#
# WHERE FILES LAND
# ----------------
# Three volumes are mounted:
#   1. ./downloads        -> /downloads   (default output + resume state)
#   2. /opt (host)        -> /opt         (your JuiceFS / encfs storage)
#   3. . (app folder)     -> /work        (source dir; in.json here is found)
#
# Inside the TUI you can set the output directory to anything under /downloads
# or /opt. To save into e.g.
#     /srv/storage/google-takeout/my-takeout
# just type or Browse to that path in the TUI — it's visible because /opt is
# mounted. A host symlink like ./downloads/opt -> /opt is also followed by the
# TUI (paths are resolved before the allowed-dir check).
#
# WRITING THE PAYLOAD FILE
# ------------------------
# The TUI searches these in.json / payload.json / curl.txt locations in order:
#   - the output dir you set (e.g. /srv/storage/google-takeout/.../in.json)
#   - the container cwd (/app — usually unmounted, skip)
#   - /downloads             (mounted from ./downloads on host)
#   - /downloads/drop        (mounted from ./drop on host)
#   - /work                  (mounted from . the app folder on host)
#   - /work/drop             (convenience alias for ./drop if it exists)
#   - $HOME (rarely useful in a container)
#
# Easiest flow: write to the SAME folder you'll download into:
#     echo '{...}' > /srv/storage/google-takeout/my-takeout/in.json
# Then type '.' in the TUI.
#
# JUICEFS / FUSE SUBMOUNTS
# ------------------------
# /opt on the host has FUSE submounts under it (JuiceFS: /srv/storage,
# gocryptfs: /opt/docker, /opt/caches). A plain bind mount would show those as
# EMPTY dirs in the container. `recursive: enabled` (rbind) captures the
# submounts that exist at start; `propagation: rslave` additionally keeps them
# in sync if the host (re)mounts them while the container runs.
#
# `rslave` requires the host /opt to be a shared or slave mount. On systemd
# systems / is shared by default, so /opt inherits that and this works. If the
# container ever FAILS TO START with a propagation error, either run once:
#     sudo mount --make-rshared /
# or drop the `propagation: rslave` line below (recursive bind alone still shows
# the submounts present at start, which is the common case).
#
# There is no web server, no exposed port, and no daemon — payloads come from
# the browser extension via your clipboard (Copy as JSON -> paste), or from
# in.json in one of the mounted folders (type '.' in the TUI).

services:
  takeout:
    build: .
    image: takeout-downloader:latest
    container_name: takeout-downloader
    # Hidden behind the `tui` profile. CLI is the default entrypoint; the
    # TUI is opt-in for users who want a UI on a local terminal.
    profiles: ["tui"]

    # Give the TUI a real terminal. Both are required for Textual to render.
    stdin_open: true   # docker run -i
    tty: true          # docker run -t

    # Optional config — all values have sane defaults; the file need not exist.
    env_file:
      - path: .env
        required: false

    environment:
      # Leave OUTPUT_DIR EMPTY by default so the app auto-detects: it prefers
      # /srv/storage/google-takeout when that exists, else ./downloads.
      # Forcing /downloads here would override that detection (the old bug).
      # Set OUTPUT_DIR in .env or the shell to pin a specific path.
      OUTPUT_DIR: ${OUTPUT_DIR:-}
      TERM: ${TERM:-xterm-256color}
      # Persist last-used TUI settings on the mounted volume so they survive
      # `--rm`. (Engine reads TAKEOUT_SETTINGS; default would be $HOME, which
      # is ephemeral in a container.)
      TAKEOUT_SETTINGS: /downloads/.takeout_settings.json
      # Mirror every log line to a file on the host's downloads volume so you
      # can `tail -f downloads/takeout.log` from a second SSH session even if
      # the TUI itself is frozen or hidden. Override with TAKEOUT_LOG_FILE.
      TAKEOUT_LOG_FILE: /downloads/takeout.log
      # /opt is an allowed output root by default, but list it explicitly in
      # case you point OUTPUT_DIR at a deep JuiceFS path.
      ALLOWED_DIRS: /opt:/downloads

    volumes:
      # Downloaded archives + resume state (.downloading, .takeout_sizes.json)
      # persist on the host so a removed container never loses progress.
      - ./downloads:/downloads

      # Payload drop box. Write your JSON here on the HOST, then type a single
      # "." in the TUI's payload box to load it — this sidesteps the broken
      # SSH->tmux->Docker paste path entirely. The TUI searches /downloads/drop
      # (among others) for in.json / payload.json / curl.txt.
      - ./drop:/downloads/drop

      # App folder mounted at /work so a file written anywhere in the project
      # (e.g. ./in.json or ./payload.json) is visible inside the container.
      # Without this, files written to the source directory are invisible to
      # the TUI because the container's /app is not the same folder.
      - .:/work

      # Host /opt (with its JuiceFS + encfs FUSE submounts) visible in-container.
      # bind-recursive + rslave is what makes the nested FUSE mounts show up.
      - type: bind
        source: /opt
        target: /opt
        bind:
          propagation: rslave
          recursive: enabled

  # CLI variant — same image, no terminal UI. Drop in.json into the output dir
  # (or pipe via stdin) and aria2c takes over with native progress output.
  # This is the recommended path for SSH->tmux->Docker chains where Textual's
  # paste / redraw is fragile. The CLI re-prompts on auth failures, so a stale
  # cookie just means you re-capture and re-run — no UI freeze.
  #
  #     docker compose build
  #     echo '{...}' > downloads/in.json
  #     docker compose run --rm takeout-cli
  #
  # Pass flags after the service name. NOTE: use SPACE not = with --out:
  #   docker compose run --rm takeout-cli --out /opt/storage/...
  # If you use --out=/path the equals sign confuses Docker Compose/runc
  # into thinking --out is an executable. Space is required.
  # Alternatively, set OUTPUT_DIR in .env to avoid the flag entirely.
  takeout-cli:
    build: .
    image: takeout-downloader:latest
    container_name: takeout-cli
    stdin_open: true                # required for interactive paste prompts
    tty: true                       # required for the bash-style readline loop
    env_file:
      - path: .env
        required: false
    environment:
      OUTPUT_DIR: ${OUTPUT_DIR:-}
      TERM: ${TERM:-xterm-256color}
      ALLOWED_DIRS: /opt:/downloads
      PARALLEL_DOWNLOADS: ${PARALLEL_DOWNLOADS:-3}
      MAX_PARTS: ${MAX_PARTS:-500}
      MAX_AUTH_REPROMPTS: ${MAX_AUTH_REPROMPTS:-5}
    volumes:
      - ./downloads:/downloads
      - ./drop:/downloads/drop
      - .:/work
      - type: bind
        source: /opt
        target: /opt
        bind:
          propagation: rslave
          recursive: enabled
    command: ["python", "-u", "takeout_cli.py"]
    entrypoint: []
